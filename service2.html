<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service</title>
</head>
<body>

     <!--Navigation-->
    <nav>
        <a href="about2.html">About Us</a>
        <a href="enquiry2.html">Enquiry</a>
        <a href="homepage2.html">Homepage</a>
        <a href="contact2.html">Contact</a>
        
    </nav>

    
      <!--Header-->
    <header>
        <h1>Desserts</h1>
        <p>Fill in all fields</p>

    </header>

    <main>
        <!--Introduction Selection-->
        <section>
            <h2>Order Form </h2>

            <form>

                <!--Full name-->
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <!--Email-->
                <label for="email">Email address:</label>
                <input type="email" id="email" email="email">

                <br><br>

                <!--Age-->
                <label for="age">Age:</label>
                <input type="number" id="age" age="age">

                <br><br>

                <!--Date of birth-->
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">

                <br><br>

                <!--Baked goods-->
                <p>Select your baked goods</p>


                <br><br>

                <!--Baked goods dropdown-->
                <label for="baked">Select your baked goods:</label>
                <select id="baked" name="baked">

                    <option value="wedding ">
                        Wedding cake
                    </option>

                    <option value="koeksisters">
                        Koeksisters
                    </option>

                    <option value="mint">
                        Peppermint crisp 
                    </option>

                      <option value="milk">
                        Milktart
                    </option>

                    <option value="cupcakes">
                        Cupcakes 
                    </option>

                

                </select>

                <br><br>

                <!--Buttons-->
                <input type="submit"
                value="Register">

                <input type="reset"
                value="Clear Form">

            </form>
        </section>

</body>
</html>
