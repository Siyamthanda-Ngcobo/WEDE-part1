<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service1</title>
</head>
<body>
    <main>
  

     <!--Navigation-->
     <nav>
        <a href="contact1.html">Contact1</a>
        <a href="enquiry1.html">Enquiry1</a>
        <a href="homepage1.html">Homepage1</a>
        <a href="about1.html">About Us1</a>
        
    </nav>
    
    <!--Header-->
    <header>
        <h1>Offerings</h1>
        <p>Programme information in full details</p>

    </header>

    

    

    
        <!--Introduction Selection-->
        <section>
            <h2>Registration Form</h2>

            <form>

                <!--Full name-->
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <!--Email-->
                <label for="email">Email address:</label>
                <input type="email" id="email" email="email">

                <br><br>

                <!--Age-->
                <label for="age">Age:</label>
                <input type="number" id="age" age="age">

                <br><br>

                <!--Date of birth-->
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">

                <br><br>

                <!--Study Type-->
                <p>Select your study option</p>

                <input type="radio"
                id="fulltime"
                name="studyOption"
                value="Full-time">

                <label for="fulltime">Full-time</label>

                <br><br>

                <!--Course dropdown-->
                <label for="course">Select your course:</label>
                <select id="course" name="course">

                    <option value="skills">
                        Business skills
                    </option>

                    <option value="mentorship">
                        Mentorship
                    </option>

                    <option value="digital">
                        Digital literacy
                    </option>

                

                </select>

                <br><br>

                 <!--Buttons-->
                <input type="submit"
                value="Register">

                <input type="reset"
                value="Clear Form">

            </form>
        </section>
    </main>

    <!--Footer-->
    &copy;2026 Kagiso Youth Development Trust

</body>
</html>
